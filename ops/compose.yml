# Ember ops, the Lookout provider for Ember. Build and run from the repo root of a clean checkout:
#   BUILD_SHA=$(git rev-parse --short HEAD) docker compose -f ops/compose.yml up -d --build
# Needs ~/.config/ember-ops/{ember_dashboard,emberops,notices-token} (mode 600) and the ops-status timer writing ~/.local/state/ember-ops.
# Lookout needs its key ~/.config/lookout/providers/ember.key (mode 600) and the external network lookout-net, both created by Lookout.
services:
  ops:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-}
    container_name: ember-ops
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      Ops__EmberConnection: Host=postgres;Port=5432;Database=emberdb;Username=ember_dashboard;GSS Encryption Mode=Disable;Command Timeout=10
      Ops__EmberPasswordFile: /run/secrets/ember_dashboard
      Ops__OpsConnection: Host=postgres;Port=5432;Database=emberops;Username=emberops;GSS Encryption Mode=Disable;Command Timeout=10
      Ops__OpsPasswordFile: /run/secrets/emberops
      AllowedHosts: localhost;127.0.0.1;172.31.250.19
      Ops__StatusFile: /status/status.json
      Ops__GitHubRepo: Tzanto01/Ember
      Ops__NoticesUrl: https://beta.ember-glow.app/notices.json
      Ops__NoticesPublishUrl: https://beta.ember-glow.app/_ops/notices
      Ops__NoticesTokenFile: /run/secrets/notices_token
      Ops__ApkUrl: https://beta.ember-glow.app/download/latest.json
      Ops__Lookout__HubAddress: 172.31.250.18
      Ops__Lookout__KeyFile: /run/secrets/lookout_key
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    secrets:
      - ember_dashboard
      - emberops
      - notices_token
      - lookout_key
    volumes:
      - ${HOME}/.local/state/ember-ops:/status:ro
    networks:
      homeserver-net:
        gw_priority: 1
      lookout-net:
        ipv4_address: 172.31.250.19
    healthcheck:
      test: ["CMD", "dotnet", "/app/Ember.Ops.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

secrets:
  ember_dashboard:
    file: ${HOME}/.config/ember-ops/ember_dashboard
  emberops:
    file: ${HOME}/.config/ember-ops/emberops
  notices_token:
    file: ${HOME}/.config/ember-ops/notices-token
  lookout_key:
    file: ${HOME}/.config/lookout/providers/ember.key

networks:
  homeserver-net:
    external: true
  lookout-net:
    external: true
