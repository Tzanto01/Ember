services:
  ember:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
      BotToken: ${BOT_TOKEN}
      DevGuildId: ${DEV_GUILD_ID:-}
      Ember__PrivacyPolicyUrl: ${PRIVACY_POLICY_URL:-}
      Ember__WebOrigin: ${WEB_ORIGIN:-}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      WebPush__Subject: ${VAPID_SUBJECT:-}
      Ember__DeletionLedgerFile: ${EMBER_DELETION_LEDGER_FILE:-}
    volumes:
      - ${EMBER_DELETION_LEDGER_DIR:-./deletion-ledger}:/ledger
    networks:
      - homeserver-net

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
      Ember__WebOrigin: ${WEB_ORIGIN}
      Ember__DataProtectionKeysPath: /keys
      Ember__WebRoot: /app/wwwroot
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Ember__ForwardedHeaders__KnownProxies__0: ${API_KNOWN_PROXY:-}
      Ember__ForwardedHeaders__KnownNetworks__0: ${API_KNOWN_NETWORK:-}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Smtp__ReplyTo: ${SMTP_REPLY_TO:-}
      Feedback__DigestTo: ${FEEDBACK_DIGEST_TO:-}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Ops__MetricsKeyFile: /run/secrets/ember_metrics
      Ember__DeletionLedgerFile: ${EMBER_DELETION_LEDGER_FILE:-}
    secrets:
      - ember_metrics
    healthcheck:
      test: ["CMD", "dotnet", "/app/Ember.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ember-api-keys:/keys
      - ${EMBER_DELETION_LEDGER_DIR:-./deletion-ledger}:/ledger
    ports:
      - "127.0.0.1:5080:8080"
    networks:
      - homeserver-net

  lookout-sender:
    profiles: ["lookout"]
    image: ${COMPOSE_PROJECT_NAME}-api
    pull_policy: never
    command: ["--lookout-sender"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
      Lookout__IngestUrl: ${LOOKOUT_INGEST_URL:-}
      Lookout__KeyFile: /run/secrets/lookout_app_ember
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    secrets:
      - lookout_app_ember
    networks:
      homeserver-net:
        gw_priority: 1
      lookout-net:
        ipv4_address: 172.31.250.20

volumes:
  ember-api-keys:

secrets:
  ember_metrics:
    file: ${HOME}/.config/ember-ops/api-metrics.key
  lookout_app_ember:
    file: ${HOME}/.config/lookout/apps/ember.key

networks:
  homeserver-net:
    external: true
  lookout-net:
    external: true
