apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def signingPasswordFile = project.findProperty('emberUploadStorePasswordFile')
def signingFilePassword = signingPasswordFile ? file(signingPasswordFile).text.trim() : null
def signing = [
    emberUploadStoreFile: project.findProperty('emberUploadStoreFile'),
    emberUploadStorePassword: project.findProperty('emberUploadStorePassword') ?: signingFilePassword,
    emberUploadKeyAlias: project.findProperty('emberUploadKeyAlias'),
    emberUploadKeyPassword: project.findProperty('emberUploadKeyPassword') ?: signingFilePassword,
]
def missingSigning = signing.findAll { !it.value }.keySet()

android {
    namespace = "app.ember.habits"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.ember.habits"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((project.findProperty('emberVersionCode') ?: '12') as int)
        versionName(project.findProperty('emberVersionName') ?: '0.10.0-beta.5')
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        if (missingSigning.isEmpty()) {
            release {
                storeFile file(signing.emberUploadStoreFile)
                storePassword signing.emberUploadStorePassword
                keyAlias signing.emberUploadKeyAlias
                keyPassword signing.emberUploadKeyPassword
            }
        }
    }
    flavorDimensions = ['channel']
    productFlavors {
        beta {
            dimension 'channel'
        }
        play {
            dimension 'channel'
        }
    }
    buildTypes {
        release {
            if (missingSigning.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

def releaseRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['assembleRelease', 'bundleRelease', 'assembleBetaRelease', 'bundleBetaRelease', 'bundlePlayRelease'] }
if (releaseRequested && !missingSigning.isEmpty()) {
    throw new GradleException("Release signing is not set up. Missing Gradle properties: ${missingSigning.join(', ')}. " +
        "Set them in ~/.gradle/gradle.properties or as ORG_GRADLE_PROJECT_<name> environment variables (see mobile/STORE.md).")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20260814"
    testImplementation "org.robolectric:robolectric:4.18.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
