name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Same-repo pull requests are already covered by the push run of their branch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Format
        run: dotnet format Ember.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  migration-order:
    # EF Core skips a migration whose id sorts before one already applied, so new ids must sort after every id on main.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: New migrations sort after main's
        run: |
          set -euo pipefail
          dir=src/Ember.Core/Data/Migrations
          ids() { sed -n 's|.*/\([0-9]\{14\}\)_[^/]*\.cs$|\1|p' | sort -u; }
          last=$(git ls-tree --name-only origin/main "$dir/" | ids | tail -1)
          [ -n "$last" ] || { echo "::error::No migrations found on origin/main"; exit 1; }
          added=$(git diff --name-only --no-renames --diff-filter=A origin/main...HEAD -- "$dir" | ids)
          fail=0
          for id in $added; do
            if [[ ! "$id" > "$last" ]]; then
              echo "::error::Migration $id sorts before $last on main; create it with dotnet ef migrations add"
              fail=1
            fi
          done
          exit $fail

  web:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun --bun run lint --max-warnings 0

      - name: Unit tests
        run: bun --bun run test

  web-build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Web build
        run: bun --bun run build

      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist/ember-web/browser
          if-no-files-found: error
          retention-days: 7

  android:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Mobile build and Capacitor sync
        working-directory: web
        run: bun --bun run build:mobile && bunx cap sync android

      - name: Android unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon testBetaDebugUnitTest testPlayDebugUnitTest

      - name: Android lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon lintBetaDebug lintPlayDebug

  e2e:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Download web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist/ember-web/browser

      - name: Build test host
        run: dotnet build tests/Ember.Api.TestHost -c Release

      - name: Start test host
        run: |
          nohup dotnet run --no-build -c Release --project tests/Ember.Api.TestHost -- --urls http://localhost:5081 --webroot web/dist/ember-web/browser > testhost.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5081/health && exit 0
            sleep 2
          done
          cat testhost.log
          exit 1

      - name: End-to-end tests
        working-directory: web
        timeout-minutes: 15
        env:
          E2E_BASE_URL: http://localhost:5081
        run: bunx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
            testhost.log
          retention-days: 7
