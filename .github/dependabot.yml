version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /ops/src/*
      - /ops/tests/*
    schedule:
      interval: monthly
    groups:
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: monthly
    groups:
      web-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories:
      - /docker
      - /ops
    schedule:
      interval: monthly
